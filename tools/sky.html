<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden}
.scene{position:absolute;inset:0;background:linear-gradient(180deg,#06152f 0%,#0b2d6b 30%,#1f57b8 55%,#5d86d6 70%,#f0a35e 88%,#ffd27a 100%)}
.cloud{position:absolute;border-radius:50%;background:rgba(255,255,255,.55);filter:blur(38px)}
.glow{position:absolute;left:-10%;right:-10%;bottom:-18%;height:45%;background:radial-gradient(ellipse at 60% 100%,rgba(255,214,120,.9),rgba(255,170,90,.35) 45%,transparent 70%);filter:blur(20px)}
svg{position:absolute;inset:0;width:100%;height:100%}
.blur{position:absolute;inset:0;filter:blur(var(--b,1.5px))}
</style></head><body><div class="blur">
