<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;width:1200px;height:630px;background:#f7f6f2;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#1d1c1a;display:flex;overflow:hidden}
.l{flex:1;padding:72px 64px;display:flex;flex-direction:column;justify-content:space-between}
.brand{display:flex;align-items:center;gap:14px;font-size:30px;font-weight:700}
h1{font-size:64px;line-height:1.05;letter-spacing:-.025em;margin:0}
p{font-size:26px;color:#6b675f;margin:0}
.r{width:360px;background:#efece5;border-left:1px solid #c9c4b8;display:grid;grid-template-columns:repeat(3,38px) 30px repeat(3,38px);gap:8px;align-content:center;justify-content:center}
.s{height:34px;border-radius:7px;background:#fff;border:1.5px solid #c9c4b8}.x{background:#dcefe1}.sel{background:#1f5fbf;border-color:#1f5fbf}.a{}
</style></head><body><div class="l"><div class="brand"><svg width="40" height="40" viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#1f5fbf"/><rect x="9" y="7" width="14" height="13" rx="4" fill="#fff"/><rect x="7" y="21" width="18" height="4" rx="2" fill="#fff"/></svg>AeroRisk</div>
<h1>Aircraft seat maps where every fact has a source</h1><p>Exit rows · missing seats · windowless seats · sources</p></div>
<div class="r" id="g"></div>
<script>const g=document.getElementById('g');for(let r=0;r<11;r++){for(let c=0;c<7;c++){const d=document.createElement('div');if(c===3){d.className='a'}else{d.className='s'+((r===4||r===5)?' x':'')+((r===7&&c===0)?' sel':'')}g.appendChild(d)}}</script>
</body></html>
