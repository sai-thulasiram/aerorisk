name: build-and-deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 1 * * *"   # daily, 06:47 India time: refresh incident data, rebuild, deploy
  workflow_dispatch:

permissions:
  contents: write          # the daily run commits the refreshed data/incidents snapshot

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Daily (and on demand, or a push whose message contains [collect]): fetch Transport Canada CADORS and
      # UK AAIB data. A source that fails keeps its previous snapshot; this step never fails the deploy.
      - name: Collect incident data
        id: collect
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[collect]')
        run: python -m aerorisk incidents || echo "collector crashed; keeping previous snapshot"

      - name: Test
        run: |
          pip install pytest
          python -m pytest -q

      - name: Build site
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          SITE_NAME: ${{ vars.SITE_NAME }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          UMAMI_WEBSITE_ID: ${{ vars.UMAMI_WEBSITE_ID }}
          CF_BEACON_TOKEN: ${{ vars.CF_BEACON_TOKEN }}
          ALLOW_AI_TRAINING: ${{ vars.ALLOW_AI_TRAINING }}
          INDEXNOW_KEY: ${{ vars.INDEXNOW_KEY }}
          ADSENSE_CLIENT: ${{ vars.ADSENSE_CLIENT }}
          ADSENSE_SLOT: ${{ vars.ADSENSE_SLOT }}
        run: |
          test -n "$SITE_URL" || { echo "Set the SITE_URL repository variable"; exit 1; }
          python -m aerorisk site --out site

      - name: Test Worker logic
        run: node --test worker/*.test.mjs

      - name: Save incident snapshot
        if: steps.collect.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/incidents
          if git diff --cached --quiet; then echo "No data changes"; exit 0; fi
          git commit -m "Update incident data $(date -u +%F)"
          git pull --rebase -q origin main && git push -q origin HEAD:main || echo "Could not push snapshot (non-fatal)"

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy

      - name: Ping IndexNow (Bing, Yandex, Seznam, Naver)
        if: ${{ vars.INDEXNOW_KEY != '' }}
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          INDEXNOW_KEY: ${{ vars.INDEXNOW_KEY }}
        run: python -m aerorisk indexnow --site-dir site || echo "IndexNow ping failed (non-fatal)"
