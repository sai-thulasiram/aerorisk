name: probe-sources
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Collect
        run: |
          /usr/bin/time -v python -m aerorisk incidents 2> err.txt; cat err.txt | grep -E "ok|FAILED|Maximum resident|Elapsed"
          ls -la data/incidents
      - name: Commit snapshot to probe branch
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/incidents && git commit -m "probe data" && git push
